// Inspired by rayronvictor's PR #248 tp react-native-config
// https://github.com/luggit/react-native-config/pull/248

def safeExtGet(prop, fallback) {
	rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
  // The Android Gradle plugin is only required when opening the android folder stand-alone.
  // This avoids unnecessary downloads and potential conflicts when the library is included as a
  // module dependency in an application project.
  if (project == rootProject) {

      repositories {
        mavenCentral()
        google()
      }

      dependencies {
        classpath("com.android.tools.build:gradle:7.2.1")
      }
  }
}

apply plugin: 'com.android.library'


android {
  namespace "com.rnfingerprint"
  compileSdkVersion safeExtGet('compileSdkVersion', 35)
  buildToolsVersion safeExtGet('buildToolsVersion', '35.0.0')

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
    versionCode 1
    versionName "1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
        mavenCentral()    
        google()

}

dependencies {
    // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation 'androidx.biometric:biometric:1.4.0-alpha04'
}